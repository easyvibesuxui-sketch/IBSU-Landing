name: Deploy to GitHub Pages

# Builds all versions into one Pages site:
#   A (this branch)              → /IBSU-Landing/
#   B (claude/ibsu-landing-b)    → /IBSU-Landing/b/
#   C (claude/ibsu-landing-c)    → /IBSU-Landing/c/
# Pushes to B and C trigger this workflow via workflow_dispatch (see trigger-pages.yml there).
on:
  push:
    branches: [claude/nifty-heisenberg-aqmakx]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nifty-heisenberg-aqmakx
          path: a
      - uses: actions/checkout@v4
        with:
          ref: claude/ibsu-landing-b
          path: b
      - uses: actions/checkout@v4
        with:
          ref: claude/ibsu-landing-c
          path: c
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build A
        working-directory: a
        run: npm ci && npm run build
      - name: Build B
        working-directory: b
        run: npm ci && npm run build
      - name: Build C
        working-directory: c
        run: npm ci && npm run build
      - name: Combine
        run: |
          mkdir site
          cp -r a/dist/. site/
          mkdir site/b
          cp -r b/dist/. site/b/
          mkdir site/c
          cp -r c/dist/. site/c/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
